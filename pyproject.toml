[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "devfun-poker-playground"
version = "0.1.0"
description = "Small inference policy adapter for dev.fun Poker Playground"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch>=2.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/devfun_poker_playground/_vendor"]
